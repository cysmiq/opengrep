# Enforces the semi-linear history described in CONTRIBUTING.md: rebase the PR
# branch, never merge the target branch into it.
name: check-linear-history

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  no-merge-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Reject merge commits on the PR branch
        env:
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          upstream=""
          if [ "$REPO" = cysmiq/opengrep ]; then
            # Verify imported history against the original repository, not a
            # branch name or a user-supplied PR label. Ordinary fork merges
            # remain forbidden, and the import must start at the current base.
            git fetch --no-tags https://github.com/opengrep/opengrep.git main
            upstream=$(git rev-parse FETCH_HEAD)
          fi
          python3 scripts/tests/test_check_pr_history.py
          bash scripts/check-pr-history "$BASE" "$HEAD" "$upstream"
